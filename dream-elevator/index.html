d goes hard when it\'s left out too long.','But put it in soup and it goes soft again.'],['"Trains"','Trains used to stop for water at every station.','Some little stations had only a water tower. No one ever got off.'],['"Shadows"','At noon, shadows are shortest.','The last page of the book says: But they never disappear.'],['"Stars"','The starlight you see left its star many years ago.','Some of those stars aren\'t there anymore. The light is still on its way.'],['"Whales"','When a whale sings in the sea, whales hundreds of kilometers away can hear it.','There\'s one whale whose song is different from all the others. No whale has ever answered it.'],['"The Last Word in the Dictionary"','This book has only one page.','It\'s blank.'],['"Mirrors"','The you in the mirror is flipped left to right.','So the you in the mirror is always waving at you with her other hand.'],['"Herbs"','Mugwort should be cut around the Dragon Boat Festival.','Dry it, burn a little in winter, and the room smells like summer.'],['"On Waiting"','This one is checked out.','There\'s only one name on the library card. Borrowed many, many times.']];
